name: Site live smoke (E30)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-live-smoke.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live HTML, Sitemap, Pagefind and notify IndexNow for E30
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from xml.etree import ElementTree as ET

          HOST = "https://ipbelova.tech"
          ROUTE = "/sravneniya/poroshkovaya-ili-co2/"

          def fetch(path, retries=9):
              url = HOST + path
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Svarka-Iznutri-Production-Smoke/1.0",
                          "Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=20) as res:
                          assert res.status == 200, (url, res.status)
                          return res.read()
                  except (OSError, AssertionError) as e:
                      last = e
                      if attempt < retries - 1:
                          time.sleep(8)
              raise RuntimeError(f"Cannot fetch {url}: {last}")

          class Article(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.canonicals = []
                  self.robots = []
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get("id"):
                      self.ids.append(a["id"])
                  if tag == "link" and a.get("rel") == "canonical":
                      self.canonicals.append(a.get("href"))
                  if tag == "meta" and a.get("name", "").lower() == "robots":
                      self.robots.append(a.get("content", ""))
                  if tag == "a" and a.get("href"):
                      self.hrefs.append(a["href"])

          raw = fetch(ROUTE).decode("utf-8")
          article = Article()
          article.feed(raw)
          for section in ("e30-processes", "e30-checklist", "e30-faq", "comparison-article-matrix"):
              assert article.ids.count(section) == 1, section
          assert len(article.ids) == len(set(article.ids)), "Duplicate HTML IDs"
          assert article.canonicals == [HOST + ROUTE], article.canonicals
          assert not any("noindex" in x.lower() for x in article.robots)
          assert all(token in raw for token in ("FCAW-S", "FCAW-G", "DCEN", "DCEP", "CO₂"))
          for p in ("/instrumenty/podbor-svarki/",
                    "/praktika/polyarnost-poroshkovoy-provoloki-bez-gaza/",
                    "/rashodka/rolik-kanal-nakonechnik-pod-provoloku/"):
              assert p in article.hrefs, "Missing E30 link: " + p
              assert len(fetch(p)) > 3000, p
          sm = ET.fromstring(fetch("/sitemap.xml"))
          locations = [n.text for n in sm.iter() if n.tag.endswith("loc")]
          assert HOST + ROUTE in locations and len(locations) >= 39, locations
          robots = fetch("/robots.txt").decode("utf-8")
          assert "Allow: /" in robots and "Disallow: /go/" in robots
          assert "Sitemap: " + HOST + "/sitemap.xml" in robots
          manifest = json.loads(fetch("/pagefind/pagefind-entry.json"))
          lang = manifest["languages"]["ru"]
          assert lang["page_count"] >= 27, lang
          assert re.fullmatch(r"ru_[a-f0-9]+", lang["hash"])
          assert len(fetch("/pagefind/pagefind." + lang["hash"] + ".pf_meta")) > 50
          print("PUBLIC_SITE_E30_SMOKE_PASS: 200, article, links, canonical, "
                f"{len(locations)} sitemap URLs, robots, Pagefind {lang['page_count']} pages")

          # Notify this known updated E30 URL only on explicit workflow push/dispatch.
          if os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch":
              key = "b41ce38b4ad1b11431053bf496f5b131"
              url = "https://yandex.com/indexnow?" + urllib.parse.urlencode({
                  "url": HOST + ROUTE, "key": key})
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Svarka-Iznutri-Production-Smoke/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      status = res.status
              except urllib.error.HTTPError as err:
                  status = err.code
              print(f"E30_INDEXNOW_HTTP_STATUS={status}")
              assert status in (200, 202), "IndexNow rejected"
              print("INDEXNOW_ACCEPTED" if status == 200 else "INDEXNOW_KEY_VERIFICATION_PENDING")
          PY

      - name: Browser responsive smoke on live E30
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check playwright
          python3 - <<'PY'
          import shutil, subprocess, sys
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              chrome = shutil.which("google-chrome") or shutil.which("chromium")
              if not chrome:
                  subprocess.run([sys.executable, "-m", "playwright", "install", "chromium"], check=True)
              browser = p.chromium.launch(executable_path=chrome, headless=True) if chrome else p.chromium.launch(headless=True)
              for width in (320, 390, 768, 1440):
                  context = browser.new_context(viewport={"width":width,"height":850},
                                                reduced_motion="reduce")
                  page = context.new_page()
                  errors = []
                  page.on("pageerror", lambda err: errors.append(str(err)))
                  response = page.goto("https://ipbelova.tech/sravneniya/poroshkovaya-ili-co2/",
                                       wait_until="domcontentloaded", timeout=60000)
                  assert response and response.status == 200, width
                  assert page.locator("#e30-processes").is_visible(), width
                  assert page.locator("#e30-checklist").count() == 1, width
                  assert page.locator("#e30-faq").count() == 1, width
                  assert page.locator(".media-figure img").count() >= 3, width
                  assert page.evaluate("document.documentElement.scrollWidth <= innerWidth + 2"), width
                  assert not errors, (width, errors)
                  print("E30_LIVE_BROWSER_PASS", width, flush=True)
                  context.close()
              browser.close()
          print("E30_RESPONSIVE_LIVE_QA_PASS", flush=True)
          PY
